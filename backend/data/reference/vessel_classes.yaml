# Bulk cargo stowage factors, used for the volume (cubic) constraint.
#
# `category` is the generic commodity a berth is equipped to handle, and is
# what the feasibility check matches against berth cargo_types. `name` is the
# specific grade, which is what drives stowage factor and calorific value.
cargoes:
  - name: thermal_coal_high_cv
    category: thermal_coal
    description: Australian 6000 kcal/kg NAR
    stowage_factor_m3_per_t: 1.22
    gcv_kcal_per_kg: 6000
  - name: thermal_coal_mid_cv
    category: thermal_coal
    description: South African / US mid grade
    stowage_factor_m3_per_t: 1.28
    gcv_kcal_per_kg: 5500
  - name: thermal_coal_low_cv
    category: thermal_coal
    description: Indonesian sub-bituminous, ICI-4 grade
    stowage_factor_m3_per_t: 1.35
    gcv_kcal_per_kg: 4200
  - name: coking_coal
    category: coking_coal
    description: Premium low volatile hard coking coal
    stowage_factor_m3_per_t: 1.19
    gcv_kcal_per_kg: 7000
  - name: iron_ore
    category: iron_ore
    description: Fines, backhaul cargo
    stowage_factor_m3_per_t: 0.42
    gcv_kcal_per_kg: 0
