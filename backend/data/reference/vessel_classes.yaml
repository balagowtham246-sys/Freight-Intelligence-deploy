# Dry bulk vessel classes in scope for East Coast India coal imports.
#
# Figures are representative of a modern vessel in each class rather than any
# single ship. Where a real candidate vessel is being screened, its own
# particulars should override these; the engine accepts either.
#
# tpc (tonnes per centimetre immersion) is derived as:
#     TPC = waterplane_area * density / 100
#         ~= (Cwp * LOA * beam) * 1.025 / 100
# with a waterplane coefficient Cwp of about 0.86-0.88 for a loaded bulk
# carrier. It is the sensitivity of displacement to draft, and it is what
# turns a centimetre of extra permissible draft into tonnes of extra cargo.
#
# grain_cubic_m3 matters for low calorific value Indonesian coal: at a
# stowage factor around 1.30 m3/t the holds fill before the marks are
# reached, so volume binds before deadweight does.

meta:
  updated: 2026-09-03
  units:
    dwt: tonnes
    loa: metres
    beam: metres
    draft: metres
    lightship: tonnes
    tpc: tonnes per centimetre
    grain_cubic: cubic metres
    consumption: tonnes per day
    speed: knots

