  - code: INHAL
    name: Haldia
    country: IN
    role: discharge
    latitude: 22.033
    longitude: 88.089
    # The Hooghly is brackish this far upstream. This materially reduces
    # loadable tonnage versus a seawater berth and is why the fresh water
    # allowance correction matters here more than anywhere else in scope.
    water_density: 1.008
    tidal_range_m: 4.6
    tide_constrained: true
    source: https://smportkolkata.shipping.gov.in/
    notes: >
      Maximum LOA 230 m (vessels to 240 m LOA / 32.26 m beam accepted in
      practice) and maximum draft about 8.5 m. Permissible draft is a
      function of LOA and is reissued monthly by SMP Kolkata draft circular,
      so this value is a default that the circular adapter overrides.
      Capesize parcels reach Haldia only by lightering at Sandheads or Sagar.
    berths:
      - name: HDC-2
        max_draft_m: 8.5
        max_loa_m: 230.0
        max_beam_m: 32.26
        max_dwt: 45000
        discharge_rate_tpd: 9000
        cargo_types: thermal_coal,coking_coal,general
        requires_gear: true
        source: SMP Kolkata Haldia Dock Complex
      - name: HDC-4B
        max_draft_m: 8.5
        max_loa_m: 230.0
        max_beam_m: 32.26
        max_dwt: 45000
        discharge_rate_tpd: 10000
        cargo_types: thermal_coal,coking_coal
        requires_gear: true
        source: SMP Kolkata Haldia Dock Complex

