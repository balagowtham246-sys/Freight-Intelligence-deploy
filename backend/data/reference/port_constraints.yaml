# Port constraint master -- India East Coast discharge ports plus the origins
# in scope. Every figure carries the source it came from.
#
# IMPORTANT: declared drafts are not constants. SMP Kolkata reissues Hooghly
# draft circulars monthly and the permissible draft there is a function of LOA.
# The values below are the current published figures; the tide model and the
# monthly circular adapter override them at runtime where available.
#
# water_density is the density actually found at the berth, not a nominal
# value: the Hooghly is brackish and the Mississippi fresh, which changes
# loadable tonnage materially through the fresh water allowance.

meta:
  updated: 2026-09-03
  units:
    draft: metres
    loa: metres
    beam: metres
    dwt: tonnes
    discharge_rate: tonnes per day
    water_density: t/m3

